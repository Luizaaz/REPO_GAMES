<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnakeSSSSSSSSSSSS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <div id="ui-header">
            <div id="score-display">SCORE: <span id="score">0</span></div>
            <div id="high-score-display">TOP: <span id="high-score-initials">---</span> <span id="high-score">0</span></div>
        </div>
        
        <canvas id="game" width="400" height="400"></canvas>
        
        <div id="instructions">
            Uae as setas para mover ou as letras (W,A,D).
            Rosa = 10 pts. <span style="color:#ffffff;">
                Dourado = 30 pts (Rápido!)</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
